name: stay_track
description: "Stay Track – Student Accommodation Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI / UX
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  badges: ^3.1.2

  # File picking & storage upload
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  path: ^1.9.1
  mime: ^2.1.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  uuid: ^4.5.1

  # Shared preferences (auth persistence helper)
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/

